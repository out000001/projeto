<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNICAP - Portal de Extensão Universitária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Figtree: fonte humanista e natural, usada em todo o portal (títulos e corpo) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Ícones usados nos componentes (spans .material-symbols-outlined) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-background: #faf9f6;
        --color-on-background: #262725;
        --color-surface: #faf9f6;
        --color-surface-dim: #d8d4cc;
        --color-surface-bright: #faf9f6;
        --color-surface-container-lowest: #ffffff;
        --color-surface-container-low: #f5f3ef;
        --color-surface-container: #efede8;
        --color-surface-container-high: #e8e5df;
        --color-surface-container-highest: #ddd9d2;
        --color-on-surface: #262725;
        --color-on-surface-variant: #66635e;
        --color-inverse-surface: #263143;
        --color-inverse-on-surface: #ecf1ff;
        --color-outline: #897171;
        --color-outline-variant: #ddc0c0;
        --color-surface-tint: #a33a44;
        --color-primary: #5b0114;
        --color-on-primary: #ffffff;
        --color-primary-container: #7a1b28;
        --color-on-primary-container: #ff888f;
        --color-inverse-primary: #ffb3b5;
        --color-secondary: #4f5e81;
        --color-on-secondary: #ffffff;
        --color-secondary-container: #c5d4fd;
        --color-on-secondary-container: #4d5b7e;
        --color-tertiary: #3e2400;
        --color-on-tertiary: #ffffff;
        --color-tertiary-container: #5d3700;
        --color-on-tertiary-container: #e79b38;
        --color-error: #ba1a1a;
        --color-on-error: #ffffff;
        --color-error-container: #ffdad6;
        --color-on-error-container: #93000a;
        --color-primary-fixed: #ffdada;
        --color-primary-fixed-dim: #ffb3b5;
        --color-on-primary-fixed: #40000b;
        --color-on-primary-fixed-variant: #84222e;
        --color-secondary-fixed: #d9e2ff;
        --color-secondary-fixed-dim: #b7c6ee;
        --color-on-secondary-fixed: #0a1a3a;
        --color-on-secondary-fixed-variant: #384668;
        --color-tertiary-fixed: #ffddba;
        --color-tertiary-fixed-dim: #ffb964;
        --color-on-tertiary-fixed: #2b1700;
        --color-on-tertiary-fixed-variant: #663e00;

        --radius-DEFAULT: 0.125rem;
        --radius-sm: 0.125rem;
        --radius-md: 0.375rem;
        --radius-lg: 0.625rem;
        --radius-xl: 1rem;
        --radius-full: 9999px;

        --space-2xs: 0.25rem;
        --space-xs: 0.5rem;
        --space-sm: 0.75rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2rem;
        --space-2xl: 3rem;
        --space-3xl: 4.5rem;

        --font-display: "Figtree", sans-serif;
        --font-headline-xl: "Figtree", sans-serif;
        --font-headline-xl-mobile: "Figtree", sans-serif;
        --font-headline-lg: "Figtree", sans-serif;
        --font-headline-md: "Figtree", sans-serif;
        --font-headline-sm: "Figtree", sans-serif;
        --font-body-lg: "Figtree", sans-serif;
        --font-body-md: "Figtree", sans-serif;
        --font-body-sm: "Figtree", sans-serif;
        --font-label-lg: "Figtree", sans-serif;
        --font-label-md: "Figtree", sans-serif;
        --font-label-sm: "Figtree", sans-serif;

        --font-size-display: 44px;
        --font-size-headline-xl: 36px;
        --font-size-headline-xl-mobile: 28px;
        --font-size-headline-lg: 28px;
        --font-size-headline-md: 22px;
        --font-size-headline-sm: 18px;
        --font-size-body-lg: 16px;
        --font-size-body-md: 14px;
        --font-size-body-sm: 12px;
        --font-size-label-lg: 14px;
        --font-size-label-md: 12px;
        --font-size-label-sm: 11px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-background);
        color: var(--color-on-background);
        font-family: var(--font-body-md);
        font-size: var(--font-size-body-md);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background-color: var(--color-primary-container);
        color: var(--color-on-primary-container);
      }

      :focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
